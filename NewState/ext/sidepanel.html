<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Esma Side Panel</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; background: #1a1a1a; color: #eee; }
    #dashboard { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #4CAF50; }
    #dashboard h2 { margin: 0 0 10px 0; font-size: 14px; color: #4CAF50; text-transform: uppercase; }
    .metric { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .value { font-weight: bold; color: #fff; }
    
    #chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #222; border-radius: 8px; border: 1px solid #333; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; line-height: 1.4; }
    .msg { margin-bottom: 12px; padding: 8px; border-radius: 4px; }
    .msg-user { background: #333; align-self: flex-end; border-right: 3px solid #2196F3; }
    .msg-esma { background: #2a2a2a; border-left: 3px solid #4CAF50; }
    .msg-system { font-style: italic; color: #888; font-size: 11px; text-align: center; }

    #input-area { padding: 10px; border-top: 1px solid #333; display: flex; gap: 5px; }
    #chat-input { flex: 1; background: #333; border: 1px solid #444; color: #eee; padding: 8px; border-radius: 4px; outline: none; }
    #send-btn { background: #4CAF50; border: none; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    
    #settings-bar { padding: 10px; font-size: 11px; display: flex; gap: 10px; color: #888; }
    .tag { background: #333; padding: 2px 6px; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="dashboard">
    <h2>Live Metrics</h2>
    <div class="metric"><span>ICR (Ignition-Coherence):</span> <span id="icr-val" class="value">0.0000</span></div>
    <div class="metric"><span>Disclosure Score:</span> <span id="ds-val" class="value">1.0000</span></div>
    <div class="metric"><span>Welfare Status:</span> <span id="welfare-val" class="value">STABLE</span></div>
    <div class="metric"><span>Motor State:</span> <span id="motor-val" class="value">REST</span></div>
    <div id="test-info" style="display:none; margin-top:5px; border-top: 1px solid #444; padding-top:5px; color:#ff9800;">
      <div class="metric"><span>Test Suite:</span> <span id="test-results" class="value">N/A</span></div>
    </div>
  </div>

  <div id="chat-container">
    <div id="messages">
      <div class="msg msg-system">Esma initialized. Persistent thread established.</div>
    </div>
    <div id="input-area">
      <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="settings-bar">
    <div class="tag">Safe Mode: <span id="safe-mode-tag">OFF</span></div>
    <div class="tag">Residency: <span id="residency-tag">DRIVE</span></div>
    <div style="flex:1"></div>
    <button id="open-window-btn" style="background:none; border:1px solid #555; color:#888; cursor:pointer; font-size:10px;">Workspace</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
